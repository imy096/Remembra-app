async function reorganizeOldNotes(){
 let changed=0;
 for(const old of [...records]){
  if(!key||old.kind!=='note'||old.categorySource||!old.content||old.title!==old.content.slice(0,180)||(old.files||[]).length)continue;
  const evidence=[old.title,old.content,old.place,old.person,old.purpose,old.steps,old.repair,old.documentUse,...(old.files||[]).map(f=>f.name)].filter(Boolean).join(' ');
  const suggestion=Smart.classify(evidence);
  if(suggestion.kind==='note'||suggestion.confidence!=='high')continue;
  const updated={...old,kind:suggestion.kind,categorySource:'automatic',previousKind:'note',categoryVersion:2,reminderNeedsReview:suggestion.kind==='event'&&!old.remindAt};

  catch(err){console.warn('Could not reorganize old note',err)}
 }

}

function lock(){key=null;records=[];activeId=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('passphrase').value='';$('auth-error').textContent='';initAuth()}
async function initAuth(){salt=await getMeta('salt');const first=!salt;$('auth-description').textContent=first?t().first:t().returning;$('auth-note').textContent=t().noRecovery;$('auth-submit').textContent=first?t().create:t().unlock;$('passphrase').placeholder=t().unlock}
async function unlock(e){e.preventDefault();const password=$('passphrase').value;try{if(!salt){salt=rand(16);key=await derive(password,salt);const check=await seal({test:'remembra-key-check'});await putMeta('salt',b64(salt));await putMeta('check',check)}else{salt=typeof salt==='string'?un64(salt):salt;key=await derive(password,salt);const check=await unseal(await getMeta('check'));if(check.test!=='remembra-key-check')throw Error('key')}await loadRecords();$('passphrase').value='';$('auth').classList.add('hidden');$('app').classList.remove('hidden');checkAlerts();navigator.storage?.persist?.().catch(()=>{})}catch(err){key=null;$('auth-error').textContent=t().badPassword;console.error(err)}}
function changeLanguage(v){lang=v;localStorage.setItem('remembra-pc-lang',v);document.documentElement.lang=v;document.documentElement.dir=v==='ar'?'rtl':'ltr';if(key)render();else initAuth()}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false});$('install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;$('install').hidden=true}};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));$('auth-form').addEventListener('submit',unlock);$('chat-form').addEventListener('submit',e=>{e.preventDefault();const raw=$('chat').value;void handle(raw)});$('mic').onclick=()=>listen(s=>{$('chat').value=s;void handle(s,true)},$('mic'));$('dictate').onclick=()=>listen(s=>{const f=$('editor-form');if(f.elements.kind.value==='guide'){f.elements.steps.value=[f.elements.steps.value,s].filter(Boolean).join(' ');if(!f.elements.title.value)f.elements.title.value=s.slice(0,120)}else{f.elements.title.value=[f.elements.title.value,s].filter(Boolean).join(' ').slice(0,300);f.elements.content.value=[f.elements.content.value,s].filter(Boolean).join(' ')}},$('dictate'));
$('record-audio').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}let stream;try{if(!window.MediaRecorder)throw Error('unsupported');stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());if($('editor').open)pendingAudio=new File([blob],'voice-note-'+Date.now()+'.webm',{type:blob.type});$('record-status').textContent=t().audioReady;$('record-audio').textContent=t().record};recorder.start();$('record-audio').textContent=t().stopRecord;$('record-status').textContent=t().audioRecording}catch(err){stream?.getTracks().forEach(t=>t.stop());console.warn(err);toast(voiceMessages[lang].denied)}};$('kind-select').onchange=()=>{$('guide-fields').classList.toggle('hidden',$('kind-select').value!=='guide')};$('editor-form').addEventListener('submit',saveEditor);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(b.dataset.close==='editor'){if(recorder?.state==='recording')recorder.stop();pendingAudio=null}$(b.dataset.close).close()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEditor(b.dataset.open));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('add').onclick=()=>openEditor();$('detail-edit').onclick=()=>{$('detail').close();openEditor('thing',activeId)};$('detail-speak').onclick=()=>{const m=records.find(x=>x.id===activeId);speak([m.title,m.content,m.purpose,m.steps,m.repair,m.documentUse].filter(Boolean).join('. '))};$('detail-calendar').onclick=()=>calendar(records.find(x=>x.id===activeId));$('detail-delete').onclick=async()=>{if(!confirm(t().confirmDelete))return;const id=activeId;await op('memories','readwrite',s=>s.delete(id));records=records.filter(m=>m.id!==id);$('detail').close();render()};$('backup').onclick=exportBackup;$('restore').onclick=()=>$('restore-file').click();$('restore-file').onchange=e=>{const f=e.target.files[0];if(f)restoreBackup(f);e.target.value=''};$('lock').onclick=lock;$('language').onchange=e=>changeLanguage(e.target.value);$('enable-alerts').onclick=async()=>{if('Notification' in window){await Notification.requestPermission();toast(Notification.permission==='granted'?'✓':t().alertsDescription)}else toast(t().alertsDescription)};$('test-bell').onclick=playBell;window.addEventListener('focus',checkAlerts);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAlerts()});setInterval(()=>{if(key){render();checkAlerts()}},15000);
(async()=>{try{db=await openDB();changeLanguage(['en','fr','ar'].includes(lang)?lang:'en')}catch(e){console.error(e);$('auth-error').textContent='This browser cannot open local storage. Try Chrome, Edge or Opera.'}})();
})();
